name: XG5000 native verification
on:
  workflow_dispatch:
    inputs:
      reuse_native_projects:
        description: Reuse the two projects saved by the verified XG5000 run
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned official XG5000 release
        if: inputs.reuse_native_projects != true
        shell: pwsh
        run: |
          curl.exe --fail --location --retry 3 --output "$env:RUNNER_TEMP\XG5000.exe" 'https://sftpssqblobcdn.blob.core.windows.net/prod/largefile/document/17846112306110/XG5000_V4.82.1_2026_07_20_Eng.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Vendor download failed' }
      - name: Extract MSI without running the launcher
        if: inputs.reuse_native_projects != true
        run: python scripts/verification/extract_vendor_installer.py --installer "${{ runner.temp }}/XG5000.exe" --output "${{ runner.temp }}/vendor-msi"
      - name: Install vendor-bundled Visual C++ prerequisites
        if: inputs.reuse_native_projects != true
        shell: pwsh
        run: |
          $runtimes = Get-ChildItem "$env:RUNNER_TEMP\vendor-msi" -Filter '*.exe'
          foreach ($runtime in $runtimes) {
            Write-Output "Installing bundled runtime: $($runtime.Name)"
            $result = Start-Process $runtime.FullName -ArgumentList '/install /quiet /norestart' -Wait -PassThru
            if ($result.ExitCode -notin @(0, 1638, 3010)) { throw "Runtime failed: $($runtime.Name): $($result.ExitCode)" }
          }
      - name: Install vendor programming tool on temporary runner
        if: inputs.reuse_native_projects != true
        timeout-minutes: 8
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'vendor-msi\XG5000.msi'
          # MicroEdge is a separate optional chained package. Its USB driver
          # stalled the offline runner, so install only the needed features.
          $log = Join-Path $env:RUNNER_TEMP 'vendor-install.log'
          # Start-Process -Wait also waits for descendants left by the MSI chainer.
          $process = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" ADDLOCAL=ALL REMOVE=MicroEdge,DriveCM /qn /norestart /L*vx! `"$log`"" -PassThru `
            -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'vendor-stdout.log') `
            -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'vendor-stderr.log')
          if (-not $process.WaitForExit(180000)) { throw "Vendor installer did not exit within 3 minutes" }
          if ($process.ExitCode -notin @(0, 3010)) { throw "Vendor install failed: $($process.ExitCode)" }
          $exe = Get-ChildItem @('C:\XG5000', 'C:\Program Files (x86)\LS', 'C:\Program Files (x86)\LSIS', 'C:\Program Files (x86)\LS ELECTRIC', 'C:\Program Files\LS ELECTRIC') -Filter XG5000.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem 'C:\Program Files (x86)' -Filter XG5000.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $exe) { throw 'Installed XG5000.exe not found' }
          "XGMAP_VENDOR_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - run: pip install pywinauto pillow
      - name: Create XBCU and XBMS projects
        if: inputs.reuse_native_projects != true
        run: python scripts/verification/inspect_vendor_ui.py --executable "${{ env.XGMAP_VENDOR_EXE }}" --output "${{ runner.temp }}/vendor-ui" --create-samples
      - name: Download verified native XGWX projects
        if: inputs.reuse_native_projects == true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44674830784
          name: XG5000-native-verification
          path: ${{ runner.temp }}
      - name: Open native projects in the published Windows app
        timeout-minutes: 5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.2.1 --pattern '*-setup.exe' --dir "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { throw 'Release installer download failed' }
          $installer = Get-ChildItem $env:RUNNER_TEMP -Filter '*-setup.exe' | Select-Object -First 1
          python scripts/verification/verify_release.py --installer $installer.FullName --projects "$env:RUNNER_TEMP/vendor-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XG5000-native-verification
          path: |
            ${{ runner.temp }}/vendor-ui
            ${{ runner.temp }}/vendor-*.log
